spring.application.name=TradeShift

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/tradeshift?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useInformationSchema=true&useOldAliasMetadataBehavior=true&generateSimpleParameterMetadata=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=3&initialTimeout=2
spring.datasource.username=<>
spring.datasource.password=<>
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.properties.hibernate.connection.isolation=2
spring.jpa.properties.hibernate.transaction.jta.platform=none

# JWT
security.jwt.secret=
security.jwt.expiration-ms=3600000

# Server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# Disable response buffering for real-time updates
server.servlet.session.tracking-modes=cookie
spring.mvc.async.request-timeout=30000

# WebSocket/STOMP Configuration
spring.websocket.sockjs.client-library-url=/webjars/sockjs-client/1.5.1/sockjs.min.js
spring.websocket.stomp.relay.enabled=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging Configuration
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=vinothrcs2003@gmail.com
spring.mail.password=unetjskeuqzrznwf
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.from=vinothrcs2003@gmail.com

# SMS Configuration (Twilio)
sms.provider=twilio
sms.twilio.account.sid=
sms.twilio.auth.token=your_actual_auth_token_here
sms.twilio.phone.number=+15551234567

# Generic SMS API (Alternative)
sms.api.url=
sms.api.key=
sms.api.sender=TradeShift
